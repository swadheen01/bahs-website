name: Monthly Notice Attachment Cleanup

# Replaces the Vercel cron (vercel.json), which never runs on Cloudflare Workers.
# Calls /api/cron/clean-notices once a month to remove attachments from notices older than 3 months.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     e.g. https://www.bahs.edu.bd   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET secret configured on the Cloudflare Worker

on:
  schedule:
    - cron: "0 0 1 * *" # 00:00 UTC on the 1st of every month
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not configured; skipping."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/clean-notices")
          echo "HTTP $HTTP_STATUS"
          cat response.json; echo
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then exit 1; fi
